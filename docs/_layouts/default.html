<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <script defer src="{{ '/assets/js/page-toc.js' | relative_url }}"></script>
  </head>
  <body>
    {% include site-header.html %}
    <div class="site-shell standard-shell">
      <main class="content" id="main-content"><article><h1>{{ page.title }}</h1>{% if page.summary %}<p class="page-summary">{{ page.summary }}</p>{% endif %}{{ content }}</article></main>
      {% include page-toc.html %}
    </div>
  </body>
</html>
